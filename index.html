<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Somiri Dev</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="shortcut icon" href="/icon.png" />

  <!-- Apple -->
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icon.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon.png" />

  <!-- Android / PWA -->
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#000000" />

  <!-- Fonts: Rajdhani is the intended display face. Without this it silently
       fell back to Arial Narrow, which is what Windows was actually rendering. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap"
  />

  <!-- Windows -->
  <meta name="msapplication-TileImage" content="/icon.png" />
  <meta name="msapplication-TileColor" content="#000000" />

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      /* Fall back to the platform UI font, not Arial Narrow — a condensed face
         reads nothing like Rajdhani and was the de-facto font on Windows. */
      font-family: 'Rajdhani', system-ui, 'Segoe UI', -apple-system, sans-serif;
      font-optical-sizing: auto;
      background-color: #000;
      color: #e2e8f0;
    }

    /* Large text wants negative tracking; body copy sits near 0. A single
       letter-spacing value is wrong at one end of the scale or the other. */
    h1 { letter-spacing: -0.022em; line-height: 1.06; }
    h2 { letter-spacing: -0.018em; line-height: 1.12; }
    h3 { letter-spacing: -0.012em; line-height: 1.2; }

    /* CRT Scanline Effect */
    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 9999;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }

    /* A 2px stripe cannot land on whole device pixels at Windows' 125%/150%
       display scaling, and the mismatch shows up as moire banding. Grow the
       stripe so it stays an even number of device pixels. */
    @media (min-resolution: 1.25dppx) {
      body::after { background-size: 100% 3px, 4px 100%; }
    }
    @media (min-resolution: 1.75dppx) {
      body::after { background-size: 100% 4px, 6px 100%; }
    }

    /* The scanline is decoration over every pixel of the page. Drop it when the
       user has asked for less transparency or more contrast. */
    @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
      body::after { display: none; }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(6, 182, 212, 0.5); /* Cyan-500 */
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(6, 182, 212, 0.8);
    }

    /* Firefox ignores ::-webkit-scrollbar entirely, so without this it kept
       drawing the default chrome scrollbar on Windows. */
    html {
      scrollbar-width: thin;
      scrollbar-color: rgba(6, 182, 212, 0.5) rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
<div id="root"></div>
<!-- Point to your TypeScript entry file. Ensure this file exists in src/ -->
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
